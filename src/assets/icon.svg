<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#191c24"/>
    </linearGradient>
    <linearGradient id="usbMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd4dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0b7c2"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4452"/>
      <stop offset="50%" stop-color="#232730"/>
      <stop offset="100%" stop-color="#16181e"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd44"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#4a5263" stroke-width="2"/>
  
  <!-- USB Metal Connector -->
  <rect x="50" y="16" width="28" height="26" rx="2" fill="url(#usbMetal)" stroke="#8e97a4" stroke-width="1"/>
  <rect x="56" y="22" width="6" height="8" rx="1" fill="#404652"/>
  <rect x="66" y="22" width="6" height="8" rx="1" fill="#404652"/>
  <rect x="57" y="26" width="4" height="3" fill="#e5b842"/>
  <rect x="67" y="26" width="4" height="3" fill="#e5b842"/>

  <!-- USB Main Body -->
  <rect x="38" y="38" width="52" height="74" rx="8" fill="url(#bodyGrad)" stroke="#525b6e" stroke-width="1.5"/>
  <rect x="42" y="42" width="44" height="66" rx="6" fill="none" stroke="#2c313d" stroke-width="1"/>

  <!-- Grip Ribs -->
  <line x1="48" y1="88" x2="80" y2="88" stroke="#4a5363" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="94" x2="80" y2="94" stroke="#4a5363" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="100" x2="80" y2="100" stroke="#4a5363" stroke-width="2" stroke-linecap="round"/>

  <!-- Activity LED Indicator -->
  <circle cx="64" cy="48" r="3" fill="#ffaa00" filter="url(#glow)"/>
  <circle cx="64" cy="48" r="1.5" fill="#fff7b2"/>

  <!-- Lightning Bolt -->
  <polygon points="68,54 54,72 63,72 57,84 74,66 65,66" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
